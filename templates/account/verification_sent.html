{% extends "base.html" %}
{% block title %}Check Your Email — SkillMap Nepal{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md text-center">
    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Check Your Email</h1>
    <p class="text-gray-500 mb-2">We've sent a confirmation link to your email address.</p>
    <p class="text-sm text-gray-400 mb-6">Click the link in the email to activate your account.</p>
    <a href="{% url 'account_login' %}" class="text-blue-600 hover:underline text-sm">
      Already confirmed? Sign in
    </a>
  </div>
</div>
{% endblock %}
